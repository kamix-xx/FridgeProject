{% extends "base.html" %}
{% load static %}

{% block title %}SmartFridge+ — Expense Tracker{% endblock %}

{% block head %}
    <link rel="expect" href="#page-transition-panel" blocking="render">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="{% static 'js/productPickers.js' %}" defer></script>
    <script src="{% static 'js/expenseCharts.js' %}" defer></script>
    <link rel="stylesheet" href="{% static 'css/modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/productModal.css' %}">
{% endblock %}

{% block content %}
    {% include "partials/background_images.html" %}

    <main class="position-relative min-vh-100 d-flex align-items-center pt-5">
        <div class="container position-relative z-2 my-5">
            <div class="glass-card mx-auto p-4 p-md-5" id="page-transition-panel">
                <h1 class="text-center mb-5 expense-title">Expense Tracker</h1>

                <div class="d-flex flex-wrap justify-content-end align-items-center gap-3 mb-4">
                    <span class="text-muted small fw-medium">From:</span>
                    <input type="date" id="startDate" class="form-control popup-input shadow-none" style="width: 140px;">

                    <span class="text-muted small fw-medium">To:</span>
                    <input type="date" id="endDate" class="form-control popup-input shadow-none" style="width: 140px;">
                </div>

                <div class="chart-container position-relative w-100 mb-5" style="min-height: 350px;">
                    <div id="expenseChart"></div>
                </div>

                <div class="expense-summary text-center position-relative mt-4">
                    <p class="summary-label mb-2">Total spent in this period</p>
                    <h2 class="summary-total mb-4" id="expenseTotal">0.00 USD</h2>

                    <div class="d-flex align-items-center justify-content-center mx-auto mt-4" style="width: 60%;">
                        <div class="summary-divider flex-grow-1"></div>
                        <a href="{% url 'expense_details' %}" class="btn btn-scroll-down rounded-circle d-flex align-items-center justify-content-center shadow-sm text-decoration-none" aria-label="Go to details">
                            <i class="bi bi-arrow-down"></i>
                        </a>
                        <div class="summary-divider flex-grow-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
