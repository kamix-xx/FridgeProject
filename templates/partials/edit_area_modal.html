<!-- Edit Area Modal -->
<div class="modal fade" id="editAreaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-popup t-modal">
            <button type="button"
                    class="btn-close popup-close-btn position-absolute top-0 end-0 m-3 shadow-none z-3"
                    data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="modal-body p-4 p-md-5">

                <div class="edit-area-morph-wrap" id="editAreaMorphWrap">
                    <!-- Panel: main -->
                    <div class="edit-area-panel text-center" data-panel="main">
                        <h3 class="popup-title mb-5">Edit Area</h3>
                        <div class="text-start mb-5">
                            <label for="editAreaName" class="form-label popup-label">Area Name</label>
                            <input type="text" class="form-control popup-input shadow-none" id="editAreaName">
                        </div>
                        <button type="button" class="popup-circular-btn mx-auto" aria-label="Save Area">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="M17 21V13H7V21M7 3V8H15M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z"
                                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                      stroke-linejoin="round"></path>
                            </svg>
                        </button>

                        <!-- Owner + shared only section -->
                        <div class="edit-area-people d-none" id="editAreaPeopleSection">
                            <hr class="popup-divider mx-auto mt-5 mb-4">
                            <p class="popup-label mb-3">Shared with</p>
                            <div class="avatar-group" id="editAreaAvatarGroup"></div>
                            <button type="button"
                                    class="btn btn-link text-decoration-none popup-btn-danger mt-4"
                                    id="stopSharingAreaBtn">
                                Stop sharing this area
                            </button>
                        </div>
                    </div>

                    <!-- Panel: full scrollable list -->
                    <div class="edit-area-panel d-none" data-panel="list">
                        <button type="button" class="edit-area-back-btn" id="editAreaListBack" aria-label="Back">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5"
                                      stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                        <h3 class="popup-title mb-4 text-center">Shared with</h3>
                        <div class="edit-area-people-list" id="editAreaPeopleList"></div>
                    </div>

                    <!-- Panel: remove-person confirmation -->
                    <div class="edit-area-panel d-none text-center" data-panel="confirm">
                        <h3 class="popup-title mb-5">
                            Are you sure you want to remove <span id="editAreaConfirmName"></span> from the area?
                        </h3>
                        <button type="button" class="btn btn-link text-decoration-none popup-btn-text mb-4"
                                id="editAreaConfirmCancel">
                            Nah, just kidding
                        </button>
                        <hr class="popup-divider mx-auto mb-4">
                        <button type="button" class="btn btn-link text-decoration-none popup-btn-danger"
                                id="editAreaConfirmRemove">
                            Yes, remove them!
                        </button>
                    </div>

                    <!-- Panel: stop-sharing confirmation -->
                    <div class="edit-area-panel d-none text-center" data-panel="confirm-stop">
                        <h3 class="popup-title mb-5">
                            Are you sure you want to stop sharing this area?
                        </h3>
                        <button type="button" class="btn btn-link text-decoration-none popup-btn-text mb-4"
                                id="editAreaStopCancel">
                            Nah, just kidding
                        </button>
                        <hr class="popup-divider mx-auto mb-4">
                        <button type="button" class="btn btn-link text-decoration-none popup-btn-danger"
                                id="editAreaStopConfirm">
                            Yes, stop sharing!
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
