<div class="col-12 px-1">

    <div class="col-12 col-sm-6 px-1">
        <label for="{{ id_prefix }}ProductExpiration" class="form-label popup-label">Expiration Date</label>
        <input type="date" name="expiration_date" class="form-control popup-input shadow-none"
               id="{{ id_prefix }}ProductExpiration">
    </div>
</div>

<!-- Inline script to handle local manual selection -->
<script>
    document.querySelectorAll('#{{ id_prefix }}CategoryMenu .category-option').forEach(item => {
        item.addEventListener('click', function (e) {
            e.preventDefault();
            const val = this.getAttribute('data-category');
            const html = this.innerHTML;
            document.getElementById('{{ id_prefix }}ProductCategory').value = val;
            document.getElementById('{{ id_prefix }}SelectedCategoryText').innerHTML = html;
        });
    });
</script>

<div class="row g-3 mx-0 mb-3">
    <div class="col-12 col-sm-4 px-1">
        <label for="{{ id_prefix }}ProductPrice" class="form-label popup-label">Price</label>
        <input type="number" name="price" class="form-control popup-input shadow-none"
               id="{{ id_prefix }}ProductPrice" min="0.01" step="0.01" inputmode="decimal">
    </div>
    <div class="col-12 col-sm-8 px-1">
        <div class="row g-0">
            <div class="col-6"><label for="{{ id_prefix }}ProductQty" class="form-label popup-label">Quantity</label>
            </div>
            <div class="col-6"><label class="form-label popup-label">Unit</label></div>
        </div>
        <div class="fused-input-group d-flex align-items-stretch">
            <input type="number" name="quantity" class="form-control shadow-none w-50 border-0 bg-transparent"
                   id="{{ id_prefix }}ProductQty" min="0.1" step="0.1" inputmode="numeric" required
                   style="padding: 0.5rem 1rem; color: inherit;">
            <div class="fused-input-divider my-2"></div>
            <div class="dropdown w-50">
                <input type="hidden" name="unit_symbol" id="{{ id_prefix }}HiddenUnitSymbol" value="psc">
                <button class="btn dropdown-toggle w-100 h-100 text-start d-flex justify-content-between align-items-center shadow-none fused-dropdown-btn border-0 bg-transparent"
                        type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        style="padding: 0.5rem 1rem; color: inherit;">
                    <span id="{{ id_prefix }}SelectedUnitText">psc</span>
                </button>
                <ul class="dropdown-menu custom-dropdown-menu w-100">
                    {% for unit in available_units %}
                        <li>
                            <a class="dropdown-item" href="#"
                               onclick="document.getElementById('{{ id_prefix }}SelectedUnitText').innerText='{{ unit.symbol }}'; document.getElementById('{{ id_prefix }}HiddenUnitSymbol').value='{{ unit.symbol }}'; return false;">
                                {{ unit.symbol }}
                            </a>
                        </li>
                    {% endfor %}
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <a class="dropdown-item text-primary fw-medium" href="#" data-bs-toggle="modal"
                           data-bs-target="#createUnitModal">
                            <i class="bi bi-plus-circle me-1"></i> Create unit
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mx-0 mb-4 align-items-center justify-content-center">
    <div class="col-12 px-1 text-center">
        <label for="{{ id_prefix }}ProductArea" class="form-label popup-label d-block text-center mb-2">Area</label>
        <div class="product-area-submit-row d-flex align-items-center justify-content-center gap-3">
            <select class="form-select popup-input shadow-none product-area-select" name="area_id"
                    id="{{ id_prefix }}ProductArea" required>
                {% for area in areas %}
                    <option value="{{ area.id }}"{% if forloop.first %} selected{% endif %}>{{ area.name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="popup-circular-btn flex-shrink-0" id="{{ id_prefix }}ProductSubmit"
                    title="{{ submit_label }}" aria-label="{{ submit_label }}">
                {% if id_prefix == 'edit' %}
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 21V13H7V21M7 3V8H15M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z"
                              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                {% else %}
                    <i class="bi {{ submit_icon }}" aria-hidden="true"></i>
                {% endif %}
            </button>
        </div>
    </div>
</div>

<!-- Hidden API macro fields -->
<input type="hidden" name="kcal" id="{{ id_prefix }}ProductKcal" value="0">
<input type="hidden" name="proteins" id="{{ id_prefix }}ProductProteins" value="0">
<input type="hidden" name="fats" id="{{ id_prefix }}ProductFats" value="0">
<input type="hidden" name="carbs" id="{{ id_prefix }}ProductCarbs" value="0">
<input type="hidden" name="nutriscore" id="{{ id_prefix }}ProductNutriscore" value="X">
