{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} siemandero {% endblock %}</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg custom-navbar fixed-top px-3 px-md-5">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-normal fs-4" href="{% url 'home' %}">SmartFridge+</a>

        <div class="d-flex align-items-center gap-3 ms-auto">
            <!-- Language Selector -->
            <div class="dropdown">
                <button class="btn btn-link text-white text-decoration-none dropdown-toggle p-0 shadow-none fs-5 d-flex align-items-center gap-1"
                        type="button" data-bs-toggle="dropdown">
                    a
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">dupa</a></li>
                    <li><a class="dropdown-item" href="#">gunwo</a></li>
                </ul>
            </div>

            <!-- Dark/Light Theme Toggle -->
            <button class="btn btn-link text-white p-0 shadow-none border-0 d-flex align-items-center" id="themeToggle"
                    type="button" aria-label="Toggle theme">
                <i class="bi bi-sun fs-5" id="themeIcon"></i>
            </button>

            <button class="btn btn-link text-white p-0 shadow-none border-0 d-flex align-items-center" id="menu"
                    type="button" aria-label="Toggle theme">
                <i class="bi bi-list fs-5" id="menuIcon"></i>
            </button>

        </div>
    </div>
</nav>

{% block content %}
    {#    <H1> It works !!!</H1>#}
{% endblock %}

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
